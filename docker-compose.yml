version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: clash_rack_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clashrack123}
      POSTGRES_DB: ${POSTGRES_DB:-clash_rack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clash_rack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: clash_rack_bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-clashrack123}@db:5432/${POSTGRES_DB:-clash_rack}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups

volumes:
  postgres_data:
